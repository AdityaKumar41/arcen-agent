name: Docker Build and Publish

on:
  workflow_dispatch:
    inputs:
      enable_docker_build:
        description: 'Type ENABLE to run the Docker build/publish workflow.'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  disabled:
    if: inputs.enable_docker_build != 'ENABLE'
    runs-on: ubuntu-latest
    steps:
      - name: Docker publishing is disabled by default
        run: |
          cat <<'EOF'
          Docker publishing is intentionally disabled for launch.

          The inherited workflow was tied to upstream Docker/cache infrastructure
          and npm packages that are not currently available from the public registry.

          Re-enable this only after choosing the target registry and fixing the
          Dockerfile/package-lock dependency path.
          EOF

  docker-build-placeholder:
    if: inputs.enable_docker_build == 'ENABLE'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse until Docker publishing is configured
        run: |
          echo "::error::Docker publishing is not configured for this fork yet."
          echo "Pick a registry/image name and fix the Docker npm dependency path before enabling this workflow."
          exit 1
