name: Static Site Checks

on:
  pull_request:
    paths:
      - 'public/**'
      - '.github/workflows/docs-site-checks.yml'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/docs-site-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-site-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Verify static installer files
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/install.sh
          test -f public/install.ps1
          test -f public/CNAME
          grep -q 'arcen-cli.arcenpay.com' public/CNAME
          grep -q 'raw.githubusercontent.com/AdityaKumar41/arcen-agent/main/scripts/install.sh' public/install.sh
          grep -q 'raw.githubusercontent.com/AdityaKumar41/arcen-agent/main/scripts/install.ps1' public/install.ps1

      - name: Stage artifact preview
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r public/* _site/
          find _site -maxdepth 1 -type f -print | sort
