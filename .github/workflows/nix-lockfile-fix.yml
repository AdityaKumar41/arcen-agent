name: Nix Lockfile Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Nix lockfile auto-fix is disabled
        run: |
          cat <<'EOF'
          Nix lockfile auto-fix is disabled for this repository.

          The inherited workflow requires upstream secrets:
          - APP_ID
          - APP_PRIVATE_KEY
          - CACHIX_AUTH_TOKEN

          Re-enable it only after configuring a GitHub App and Cachix cache for
          AdityaKumar41/arcen-agent.
          EOF
