name: Nix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Nix CI is disabled by default
        run: |
          cat <<'EOF'
          Nix CI is disabled for launch.

          The inherited Nix workflows depend on upstream Cachix/Nix automation
          and should be re-enabled only after the Nix package path is maintained
          for this fork.
          EOF
