name: Skills Index Freshness Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Skills index freshness check is disabled
        run: |
          cat <<'EOF'
          Skills index freshness checks are disabled for launch.

          The launch site currently serves installer files from public/.
          There is no deployed /docs/api/skills-index.json endpoint to probe.
          EOF
