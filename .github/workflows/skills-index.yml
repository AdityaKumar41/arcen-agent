name: Build Skills Index

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Skills index publishing is disabled
        run: |
          cat <<'EOF'
          Skills index publishing is disabled for launch.

          This repository currently deploys a static installer site from public/.
          Re-enable this only after deciding where the Skills Hub JSON should be
          generated and hosted.
          EOF
