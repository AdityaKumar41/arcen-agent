name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Compile launch modules
        run: |
          source .venv/bin/activate
          python -m py_compile \
            cli.py \
            arcen_cli/banner.py \
            arcen_cli/main.py \
            arcen_cli/skin_engine.py \
            agent/skill_utils.py

      - name: Run focused smoke tests
        run: |
          source .venv/bin/activate
          python -m pytest -q \
            tests/test_packaging_metadata.py \
            tests/acp/test_registry_manifest.py \
            tests/skills/test_agent_browser_skill.py \
            tests/skills/test_find_skills_skill.py \
            tests/skills/test_skill_utils_packaged_paths.py
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
