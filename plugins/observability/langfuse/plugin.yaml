name: langfuse
version: "1.0.0"
description: "Optional Langfuse observability for Arcen — traces conversations, LLM calls, and tool usage. Opt-in via `arcen plugins enable observability/langfuse` or `arcen tools → Langfuse Observability`."
author: NousResearch
requires_env:
  - ARCEN_LANGFUSE_PUBLIC_KEY
  - ARCEN_LANGFUSE_SECRET_KEY
hooks:
  - pre_api_request
  - post_api_request
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
